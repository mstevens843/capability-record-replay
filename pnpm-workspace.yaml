packages:
  - "packages/*"
  # fixtures are workspace members: the hostile web app and the green-screen TUI app are the
  # proxy target this system automates. They are private, never published, and exist so that
  # session timeouts, permission denials and not-found results can be injected on demand -
  # which a public demo site cannot do, and which half of assignment section 3.3 requires.
  - "fixtures/*"

# Refuse to install any package version published less than 7 days ago (10080 minutes).
# This neutralizes near-real-time worm propagation, which has spread end-to-end in under
# 30 minutes. If you genuinely need a fresh release, drop this to 0 for one install and
# put it straight back.
minimumReleaseAge: 10080
